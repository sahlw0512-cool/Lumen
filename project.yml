# XcodeGen spec: `brew install xcodegen && xcodegen generate` creates Lumen.xcodeproj.
name: Lumen
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Xcode 26 templates default these on; this code base is written for the classic model.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: NO
targets:
  Lumen:
    type: application
    platform: macOS
    sources:
      - path: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Lumen
        PRODUCT_NAME: Lumen
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lumen
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        CODE_SIGN_ENTITLEMENTS: Lumen/Lumen.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - LumenTests
  LumenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LumenTests
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LumenTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lumen.app/Contents/MacOS/Lumen"
        BUNDLE_LOADER: "$(TEST_HOST)"
